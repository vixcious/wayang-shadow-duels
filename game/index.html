<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAYANG — Shadow-Puppet Duels</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0602; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; cursor: pointer; background: #1c0f06; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Wayang: shadow-puppet duels. Move with A and D, jump with W, block with S, attack with J and K, special art with L."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
